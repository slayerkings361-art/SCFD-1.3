name: Build SCFD 1.3 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract SCFD source
        run: |
          mkdir -p source
          unzip -q "SCFD-1.3-Android-Source.zip" -d source
          test -f source/app/build.gradle

      - name: Build Android APK
        working-directory: source
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SCFD-1.3-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
